<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veritas | Phishing Reporter</title>
    <!-- Tailwind CSS via CDN für schnelles Setup -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="p-6 border-b border-slate-800 flex justify-between items-center max-w-4xl mx-auto w-full">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
            <span class="font-bold text-xl tracking-wider text-white">VERITAS<span class="text-red-500">.CORE</span></span>
        </div>
        <span class="text-xs text-slate-400 uppercase tracking-widest border border-slate-800 px-3 py-1 rounded">Security Vault</span>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <h1 class="text-2xl font-bold mb-2">Verdächtige Domain melden</h1>
            <p class="text-slate-400 text-sm mb-6">Gib die URL ein, die von Veritas analysiert, im S3-Vault archiviert und auf bösartige Muster geprüft werden soll.</p>

            <form id="reportForm" class="space-y-4">
                <div>
                    <label for="urlInput" class="block text-xs font-semibold text-slate-400 uppercase mb-2">Ziel-URL / Domain</label>
                    <input type="url" id="urlInput" required placeholder="https://example-phish-login.com"
                        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-red-500 transition-colors">
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-3 rounded-lg transition-all shadow-lg shadow-red-900/30">
                    Analyse starten & Archivieren
                </button>
            </form>

            <!-- Status / Feedback Box -->
            <div id="statusBox" class="hidden mt-6 p-4 rounded-lg border text-sm"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-6 text-center text-xs text-slate-600 border-t border-slate-900">
        Veritas Ecosystem &bull; Evidence-based Phishing Defense
    </footer>

    <!-- JavaScript für den API-Trigger -->
    <script>
        const form = document.getElementById('reportForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusBox = document.getElementById('statusBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('urlInput').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Analysiere & Sichere...';
            statusBox.className = 'hidden mt-6 p-4 rounded-lg border text-sm';

            try {
                // HIER SPÄTER DIE API-GATEWAY-URL EINTRAGEN
                const API_ENDPOINT = 'YOUR_API_GATEWAY_URL_HERE';

                /*
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await response.json();
                */

                // Mock-Erfolgsmeldung für den Anfang
                await new Promise(r => setTimeout(r, 1500));

                statusBox.className = 'mt-6 p-4 rounded-lg border bg-emerald-950/40 border-emerald-800 text-emerald-200 text-sm';
                statusBox.innerHTML = `<strong>Erfolgreich eingereicht!</strong> Die URL wird im Hintergrund von Veritas analysiert.`;
            } catch (err) {
                statusBox.className = 'mt-6 p-4 rounded-lg border bg-red-950/40 border-red-800 text-red-200 text-sm';
                statusBox.innerHTML = `<strong>Fehler:</strong> Konnte den Job nicht an das Backend übergeben.`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Analyse starten & Archivieren';
            }
        });
    </script>
</body>
</html>
